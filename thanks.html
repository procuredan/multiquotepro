<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Thank You – MultiQuotePro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="page">
  <div class="wrapper">
    <header>
      <div class="logo">MultiQuote<span>Pro</span></div>
    </header>

    <main class="section">
      <div class="card" style="max-width: 720px; margin: 2rem auto;">
        <h2>Thanks — you’re all set.</h2>
        <p style="margin-top: 0.75rem;">
          Thank you for your interest. We’ll be in touch soon.
        </p>

        <div style="margin-top: 1.25rem;">
          <a href="/" class="btn btn-primary">Back to MultiQuotePro</a>
        </div>
      </div>
    </main>

    <footer>
      &copy; <span id="year"></span> MultiQuotePro. All rights reserved.
    </footer>
  </div>
</div>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
